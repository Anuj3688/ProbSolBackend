# Dynamic port assignment for Render ($PORT) with fallback to 8080
server.port=${PORT:8080}

# SQLite Database Configuration
# Overridable via DB_FILE_PATH (e.g. /data/probsol.db if using a persistent disk)
spring.datasource.url=jdbc:sqlite:${DB_FILE_PATH:probsol.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# JPA & Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# JWT Secret & Expiry (Overridable via Render environment variables)
probsol.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
probsol.jwt.access-token-expiration-ms=900000
probsol.jwt.refresh-token-expiration-ms=2592000000

# CORS Allowed Origins (Comma-separated, overridable in Render for deployed frontend)
probsol.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4173,http://127.0.0.1:3000,http://127.0.0.1:5173}

# Seed Data (Creates default daily personal account if empty)
probsol.seed.enabled=${SEED_ENABLED:true}
probsol.seed.email=${SEED_EMAIL:anuj@probsol.dev}
probsol.seed.password=${SEED_PASSWORD:Password123!}
probsol.seed.display-name=${SEED_DISPLAY_NAME:Anuj Tiwari}
